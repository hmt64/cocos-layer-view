<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="panel.css">
</head>
<body>
<div id="bar">
  <button id="bView" title="Toggle the 3D layer view (Alt+Shift+L)">Layer view</button>
  <button id="bBack" title="Back to the parent level (Esc)">◂ Back</button>
  <button id="bIa" title="Give mouse / keys back to the game (I)">☝ Interact</button>
  <button id="bH3" title="Hide the 3D world so only the 2D UI is shown">Hide 3D</button>
  <span class="sep"></span>
  <button id="bPause" title="Pause / resume the game logic (P)">⏸ Pause</button>
  <button id="bStep" title="Run one frame then pause (.)">⏭ Step</button>
  <span class="sep"></span>
  <span class="lbl">Spacing</span>
  <button id="bGapMinus" title="Less space between layers">−</button>
  <output id="oGap">1×</output>
  <button id="bGapPlus" title="More space between layers">+</button>
  <button id="bGapReset" title="Default spacing">↺</button>
  <span class="grow"></span>
  <span id="status"></span>
</div>
<div id="empty">
  <p id="emptyMsg">Anatomy is not running on this page.</p>
  <button id="bInject">Load Anatomy into the page</button>
</div>
<div id="main">
  <div id="treeWrap">
    <div id="treeHead"></div>
    <div id="tree"></div>
  </div>
  <div id="side">
    <div id="noSel">Click a node in the tree to edit it.</div>
    <div id="selBox">
      <div id="path"></div>
      <label class="active"><input type="checkbox" id="cActive"> Active <small id="activeHint"></small></label>
      <div class="sect">Transform</div>
      <div class="help">Drag X / Y / Z left-right · ↑↓ in a box (Shift ×10, Alt ×0.1) · mouse wheel on the focused box · type + Enter</div>
      <div id="xf"></div>
      <div class="actions">
        <button id="bReset" class="warm">Reset</button>
        <button id="bCopy">Copy</button>
        <button id="bEdits">All edits (0)</button>
      </div>
    </div>
  </div>
</div>
<script src="panel.js"></script>
</body>
</html>
